providers:
  docker: {type: docker}
  anthropic: {type: anthropic}

platforms:
  local: {type: docker, provider: docker, namespace: dev}

models:
  minimax:
    provider: anthropic
    model_name: MiniMax-M2.7
    parameters:
      temperature: 0.3
      anthropic_api_url: https://api.minimax.io/anthropic

agents:
  - name: shop-agent
    framework: langchain-python
    instructions: |
      You are a helpful assistant for a small e-commerce shop.
      Answer concisely.
    default_model: minimax
    platform: local
    skills:
      - research                    # folder skill: skills/research/
      - name: orders                # inline skill: tools only
        tools: [lookup_order]
    secrets:
      - {name: ANTHROPIC_API_KEY}
      - {name: ANTHROPIC_API_URL}

channels:
  - name: slack-shop
    type: slack
    platform: local
    secrets:
      - {name: SLACK_BOT_TOKEN}
      - {name: SLACK_APP_TOKEN}
    agents: [shop-agent]
    default_agent: shop-agent
