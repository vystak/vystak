name: mcp-files-agent
framework: langchain-python
instructions: |
  You are a file analysis agent. You can read files from the /docs directory
  using your MCP tools. When asked about files, use your tools to read and
  analyze them. List files before reading to know what's available.
default_model:
  name: minimax
  provider:
    name: anthropic
    type: anthropic
  model_name: MiniMax-M2.7
  parameters:
    temperature: 0.3
    anthropic_api_url: https://api.minimax.io/anthropic
platform:
  name: docker
  type: docker
  provider:
    name: docker
    type: docker
mcp_servers:
  # Local stdio server: `command` is the bare executable, arguments go in
  # `args`. Transport is inferred (command → stdio, url → streamable_http).
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/docs"]
  # Remote variant (uncomment and add GITHUB_TOKEN to secrets below):
  # - name: github
  #   url: https://api.githubcopilot.com/mcp
  #   headers:
  #     Authorization: Bearer ${secret.GITHUB_TOKEN}
secrets:
  - name: ANTHROPIC_API_KEY
port: 8093
