providers:
  docker: {type: docker}
  anthropic: {type: anthropic}

platforms:
  local:
    type: docker
    provider: docker
    namespace: dev
    telemetry: {enabled: true}     # auto-provisions vystak-otel (grafana/otel-lgtm) on :13000

models:
  sonnet:
    provider: anthropic
    model_name: claude-sonnet-4-6
    parameters: {temperature: 0.3}

agents:
  - name: weather-agent
    framework: langchain-python
    instructions: |
      You are a weather specialist. Use the get_weather tool to fetch real
      weather data for the city the user asks about. Answer concisely.
    model: sonnet
    platform: local
    skills:
      - {name: weather, tools: [get_weather]}
    secrets:
      - {name: ANTHROPIC_API_KEY}

  - name: time-agent
    framework: langchain-python
    instructions: |
      You are a time specialist. Use the get_time tool to fetch the current
      UTC time. Answer concisely.
    model: sonnet
    platform: local
    skills:
      - {name: time, tools: [get_time]}
    secrets:
      - {name: ANTHROPIC_API_KEY}

  - name: assistant-agent
    framework: langchain-python
    instructions: |
      You are a friendly general-purpose assistant.
      When the user asks about weather, call ask_weather_agent.
      When the user asks about time, call ask_time_agent.
      When asked for a periodic check-in (heartbeat), call BOTH subagents
      in parallel and post a concise digest.
    model: sonnet
    platform: local
    subagents: [weather-agent, time-agent]
    secrets:
      - {name: ANTHROPIC_API_KEY}
    heartbeat:
      schedule: "*/10 * * * *"                     # every 10 minutes
      timezone: UTC
      target_channel: slack-main.channels.dev
      target_thread: C0AV6PJ4VHU                   # vystack-channel-3
      ack_max_chars: 300
      isolated_session: true
      skip_when_busy: true
      prompt: |
        It is the periodic check-in. In parallel, call ask_weather_agent
        with city="New York" and ask_time_agent. Post a 2-line digest:
        line 1 — `🕐 <time from get_time>`,
        line 2 — `🌤️ <weather summary from get_weather>`.
        Do NOT include the text HEARTBEAT_OK — every fire should produce
        the digest.

channels:
  - name: slack-main
    type: slack
    platform: local
    config: {port: 8081}
    secrets:
      - {name: SLACK_BOT_TOKEN}
      - {name: SLACK_APP_TOKEN}
    agents: [assistant-agent, weather-agent, time-agent]
    default_agent: assistant-agent
