providers:
  azure:
    type: azure
    config:
      location: eastus2
      resource_group: vystak-ws-example-rg
      storage_account: ${AZURE_STORAGE_ACCOUNT}   # required for workspace.persistence: volume
  anthropic:
    type: anthropic

platforms:
  aca:
    type: container-apps
    provider: azure

vault:
  name: vystak-vault
  provider: azure
  mode: deploy
  config:
    vault_name: vystak-ws-example-vault

models:
  sonnet:
    provider: anthropic
    model_name: claude-sonnet-4-20250514

agents:
  - name: assistant
    framework: langchain-python
    instructions: Use the charge_card tool to collect Stripe payments.
    default_model: sonnet
    secrets:
      - name: ANTHROPIC_API_KEY
        framework: langchain-python
    workspace:
      name: tools
      image: python:3.11-slim
      persistence: volume
      provision:
        - pip install requests stripe
      secrets:
        - name: STRIPE_API_KEY
          framework: langchain-python
    skills:
      - name: payments
        framework: langchain-python
        tools:
          - charge_card
    platform: aca
