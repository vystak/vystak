providers:
  docker: {type: docker}
  anthropic: {type: anthropic}

platforms:
  local: {type: docker, provider: docker}

vault:
  name: vystak-vault
  provider: docker
  type: vault
  mode: deploy
  config: {}

models:
  sonnet:
    provider: anthropic
    model_name: claude-sonnet-4-20250514

agents:
  - name: assistant
    framework: langchain-python
    instructions: Use charge_card for Stripe charges.
    default_model: sonnet
    secrets:
      - name: ANTHROPIC_API_KEY
        framework: langchain-python
    workspace:
      name: tools
      type: persistent
      secrets:
        - name: STRIPE_API_KEY
          framework: langchain-python
      filesystem: true
    skills:
      - name: payments
        framework: langchain-python
        tools: [charge_card]
    platform: local
